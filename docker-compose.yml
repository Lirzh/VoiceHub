services:
  voicehub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      # 密钥一律从 .env 注入，无默认值：示例值公开可查，等同于无密钥
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL 必须设置，参考 .env.example}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置，执行 openssl rand -base64 48 生成}
      - NODE_ENV=production
      - SKIP_BUILD=true
      # 可选注入（在 .env 中配置，未留空即按默认行为）：
      # NUXT_PUBLIC_HOST 站点对外域名，未配置时「忘记密码」不发邮件（503）
      # TRUSTED_CLIENT_IP_HEADERS 位于反向代理/CDN 之后必填，否则全部用户共用代理 IP，
      #   IP 封禁与限流会全站连坐（例：Nginx 用 x-real-ip，EdgeOne 用 eo-connecting-ip）
      # PLUGIN_SHARED_SECRET 配置后 ClassIsland 等外部插件请求必须附带 HMAC 签名
      - NUXT_PUBLIC_HOST=${NUXT_PUBLIC_HOST:-}
      - TRUSTED_CLIENT_IP_HEADERS=${TRUSTED_CLIENT_IP_HEADERS:-}
      - PLUGIN_SHARED_SECRET=${PLUGIN_SHARED_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: Dockerfile-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=voicehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d voicehub']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
